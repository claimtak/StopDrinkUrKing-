<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b80000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>STOP! drink Ur KING</title>
<style>
:root{--red:#b80000;--bg:#fff;--fg:#1d1d1d;--mut:#666;--gold:#e0a800;--line:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f5f5f5;--mut:#aaa;--line:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:460px;margin:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.logo{display:block;margin:0 auto 6px;max-width:120px;height:auto}
h1,h2{text-align:center;color:var(--red)}
.tag{text-align:center;font-weight:800;color:var(--red);font-size:20px}
.big{font-size:96px;font-weight:800;text-align:center;color:var(--red);line-height:1}
.sm{text-align:center;color:var(--mut);font-size:14px;margin:4px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;background:var(--red);color:#fff;width:100%;margin:6px 0;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.g{background:#2e7d32}
button.o{background:transparent;color:var(--red);border:1px solid var(--red)}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:4px 0}
.row{display:flex;gap:8px}
.row button{width:auto;flex:1}
.langs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.langs button{width:auto;padding:6px 14px;border-radius:999px;background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
.langs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.cell.sel{outline:2px solid var(--red)}
.ic{font-size:11px;color:var(--red)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);font-size:12px;filter:grayscale(1);opacity:.5}
.bd.on{filter:none;opacity:1;background:linear-gradient(135deg,#fff3c4,#e0a800);color:var(--red);border-color:var(--gold);font-weight:700}
.slipBig{font-size:24px;padding:20px;margin-top:10px}
.msg{font-size:17px;line-height:1.6;text-align:center;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.show{display:flex}
.mc{background:var(--bg);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center}
canvas{width:100%;height:auto;border-radius:12px}
.hide{display:none!important}
footer{text-align:center;font-size:12px;color:var(--mut);margin-top:18px;line-height:1.8}
footer a{color:var(--red);font-weight:600;text-decoration:none}

/* Phase 1 मुख्य पेज: एकाच मोबाईल स्क्रीनमध्ये, स्क्रोल न करता */
body.fit{height:100vh;height:100dvh;overflow:hidden;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
body.fit .langs{margin-bottom:2px}
body.fit .langs button{padding:4px 12px;font-size:14px;margin:0}
body.fit .logo{max-width:64px;margin:0 auto}
body.fit #counter{font-size:12px;margin:0}
body.fit #app h2{font-size:18px;margin:0 0 2px}
body.fit .card{padding:6px 8px;margin:4px 0}
body.fit .big{font-size:60px}
body.fit .sm{font-size:13px;margin:1px 0;line-height:1.3}
body.fit .msg{font-size:14px;line-height:1.35}
body.fit button{padding:8px;margin:3px 0;font-size:15px}
body.fit .slipBig{font-size:20px;padding:11px;margin-top:6px}
body.fit #grp{display:none}
body.fit footer{font-size:11px;margin-top:2px;line-height:1.4}
</style>
</head>

<section id="app" class="hide">
  <h2 id="hi"></h2>
  <div class="card">
    <div class="sm" id="todayL"></div>
    <div class="big" id="d">0</div>

    <div class="sm" id="gate"></div>

  <div class="card msg" id="msg"></div>

    <button id="profBtn" class="o" data-t="prof"></button>
  </div>
  <button id="slip" class="slipBig" data-t="slipBtn"></button>
  <p class="sm" data-t="slipNote"></p>
  <button id="openBtn" class="alt hide"></button>

  <div id="p2box" class="card hide">
    <div class="tag" data-t="p2"></div>
    <h3 data-t="bdg"></h3>
    <div class="badges" id="badges"></div>
    <button id="logBtn" class="alt" data-t="log"></button>
    <div id="logWrap" class="hide">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button id="prev" class="alt" style="width:auto;padding:6px 12px">‹</button>
        <b id="mon"></b>
        <button id="next" class="alt" style="width:auto;padding:6px 12px">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <div id="ed"></div>
    </div>
    <button id="p2slip" class="alt" data-t="p2slip"></button>
  </div>
</section>

<!-- प्रोफाइल -->
<section id="prof" class="hide">

  <input id="n2" maxlength="30">
  <input id="a2" type="number" min="10" max="110" inputmode="numeric">
  <button id="saveBtn" data-t="save"></button>
  <button id="backBtn" class="o" data-t="back"></button>
  <div class="card">
    <button id="exBtn" class="g" data-t="bk"></button>
    <button id="imBtn" class="o" data-t="rs"></button>
    <p class="sm" data-t="bkNote"></p>
    <input type="file" id="im" accept=".json,application/json" class="hide">
  </div>
</section>

<footer>
  <a data-t="grp" id="grp" href="https://www.facebook.com/share/1KW25eX7by/" target="_blank" rel="noopener"></a><br>
  <a href="https://punepoona.in">punepoona.in</a> · <a href="https://claimtak.in">claimtak.in</a> · <a href="https://navinpune.com">navinpune.com</a>
</footer>

<!-- पॉप-अप -->
<div class="ov" id="ov"><div class="mc">

  <p id="cM" class="msg"></p>
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="cS" data-t="share"></button>
  <button id="cQ" class="alt">🔄</button>
  <button id="cL" class="alt" data-t="later"></button>

<div class="ov" id="lgOv" style="z-index:11"><div class="mc">

function lg(){ return (S.lang && T[S.lang]) ? S.lang : 'mr'; }
function tx(k){ return (T[lg()][k]!==undefined)?T[lg()][k]:T.mr[k]; }

/* ---------- डेटा (जुने फील्ड जसेच्या तसे) ---------- */
function load(){
  const raw=localStorage.getItem(KEY);
  if(raw===null) return {};
  let o;
  try{ o=JSON.parse(raw); if(!o||typeof o!=='object'||Array.isArray(o)) throw 0; }
  catch(e){ localStorage.setItem('ds_corrupt_'+Date.now(), raw); blocked=true; return {}; }
  localStorage.setItem('ds_bk', raw);
  return o;
}
function save(){
  if(blocked) return;
  const prev=localStorage.getItem(KEY);
  if(prev!==null) localStorage.setItem('ds_prev', prev);
  S.schemaVersion=2;
  localStorage.setItem(KEY, JSON.stringify(S));
}
function ensure(){
  if(!S.lang) S.lang='mr';
  if(!S.p2||typeof S.p2!=='object') S.p2={active:false,start:null,logs:{}};
  if(!S.p2.logs) S.p2.logs={};
  if(typeof S.best!=='number') S.best=+S.best||0;
  if(S.slips===undefined) S.slips=0;
}
function slipCount(){ return Array.isArray(S.slips)?S.slips.length:(+S.slips||0); }

function today(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function days(){
  if(!S.start) return 0;
  return Math.max(1,Math.round((today()-new Date(S.start))/DAY)+1);
}
function completed(){ return Math.max(+S.best||0, days()-1); }
function eligible(){ return completed()>=36; }
function p2count(){
  if(!S.p2.start) return 0;
  return Object.keys(S.p2.logs).filter(k=>k>=S.p2.start && (S.p2.logs[k].s==='done'||S.p2.logs[k].s==='done_late')).length;
}
function level(){ return Math.min(12,Math.floor(p2count()/6)); }
function quoteOf(i){ const m=T[lg()].m; return m[((i%m.length)+m.length)%m.length]; }

/* ---------- Firebase install counter ---------- */
async function readCount(){
  let cache=null;
  try{ cache=JSON.parse(localStorage.getItem('cc')||'null'); }catch(e){}
  if(cache && Date.now()-cache.t<5*60e3) return cache.n;
  try{
    const r=await fetch(CNT_BASE+'?key='+FB.apiKey);
    if(!r.ok) throw 0;
    const j=await r.json();
    const n=+(j.fields&&j.fields.installs&&j.fields.installs.integerValue)||0;
    localStorage.setItem('cc',JSON.stringify({n,t:Date.now()}));
    return n;
  }catch(e){ return cache?cache.n:null; }
}
async function countInstall(){
  if(!IS_LIVE) return;
  if(localStorage.getItem('ci')==='1') return;
  try{
    const r=await fetch(CNT_BASE+'?key='+FB.apiKey);
    if(!r.ok) return;
    const j=await r.json();
    const cur=+(j.fields.installs.integerValue)||0;
    const url=CNT_BASE+'?updateMask.fieldPaths=installs&key='+FB.apiKey;
    const w=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{installs:{integerValue:String(cur+1)}}})});
    if(w.ok){ localStorage.setItem('ci','1'); localStorage.removeItem('cc'); }
  }catch(e){}
}
async function showCount(){
  const n=await readCount();
  if(n!==null) lastCount=n;
  renderCounter();
}
function renderCounter(){
  $('counter').textContent = lastCount!==null ? lastCount.toLocaleString('en-IN')+' '+tx('ppl') : '';
}

/* ---------- घसरणी ---------- */
function slipMain(){
  if(!confirm(tx('conf'))) return;
  S.best=Math.max(+S.best||0,days());
  S.slips=slipCount()+1;
  S.start=Date.now();
  save(); render();
}
function slipP2(){
  if(!confirm(tx('p2c'))) return;
  S.p2.start=iso(today());
  save(); render();
}

/* ---------- Phase 2 ---------- */
function checkOpen(){
  if(!S.p2.active && eligible()){ S.p2.active=true; S.p2.start=iso(today()); save(); }
}
function openManual(){
  if(!eligible()) return;
  S.p2.active=true; S.p2.start=iso(today()); save(); render();
}

/* ---------- नोंद ---------- */
function logSet(status){
  const k=selDate, before=level();
  const st=(status==='done' && k<iso(today()))?'done_late':status;
  S.p2.logs[k]={s:st,plan:$('pl').value.trim(),note:$('nt').value.trim()};
  save();
  const after=level();
  render();
  if(status==='done' && after>before) showCong(tx('nb'), tx('nbm')+' '+BADGES[lg()][after-1]);
}
function renderLog(){
  const y=vm.getFullYear(), m=vm.getMonth(), first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  $('mon').textContent=vm.toLocaleDateString(lg()==='en'?'en-IN':(lg()==='hi'?'hi-IN':'mr-IN'),{month:'long',year:'numeric'});
  let h='';
  for(let i=0;i<first;i++) h+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=iso(new Date(y,m,d)), l=S.p2.logs[k];
    h+=`<div class="cell${k===selDate?' sel':''}" data-d="${k}">${d}<span class="ic">${l?ICON[l.s]:''}</span></div>`;
  }
  $('cal').innerHTML=h;
  if(selDate){
    const l=S.p2.logs[selDate]||{};
    $('ed').innerHTML=`<div class="card"><b>${selDate}</b>
      <textarea id="pl" rows="2" placeholder="${tx('plan')}"></textarea>
      <textarea id="nt" rows="4" placeholder="${tx('note')}"></textarea>
      <button data-s="done">${tx('dn')}</button>
      <button data-s="plan" class="alt">${tx('pl')}</button>
      <button data-s="missed" class="alt">${tx('ms')}</button></div>`;
    $('pl').value=l.plan||''; $('nt').value=l.note||'';
  } else $('ed').innerHTML='';
}

/* ---------- भाषा आणि मजकूर ---------- */
function applyLang(){
  document.documentElement.lang=lg();
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=tx(el.dataset.t); });
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on', b.dataset.l===lg()));
  $('n').placeholder=tx('name'); $('a').placeholder=tx('age');
  $('n2').placeholder=tx('name'); $('a2').placeholder=tx('age');
  $('ios').textContent=tx('ios');
  renderCounter();
}
function setLang(l){
  if(!T[l]) return;
  S.lang=l; save(); applyLang(); render();
}

/* ---------- पेज दाखवणे ---------- */
function go(p){
  ['home','reg','app','prof'].forEach(x=>$(x).classList.toggle('hide', x!==p));
  document.body.classList.toggle('fit', p==='app' && !S.p2.active);
  if(p==='prof'){ $('n2').value=S.name||''; $('a2').value=S.age||''; }
  if(p==='app') render();
}

/* ---------- रेंडर ---------- */
function render(){
  const act=S.p2.active, d=days(), p=p2count();
  $('logo').src=act?'start-logo.png':'stop-logo.png';
  $('logo').style.display='';
  $('hi').textContent=S.name||(act?tx('p2'):tx('title'));
  $('todayL').textContent=tx('today');
  $('d').textContent=act?p:d;
  $('bigL').textContent=act?tx('p2d'):tx('d');
  $('small').textContent=act?(tx('stopD')+': '+d):'';
  $('sl').textContent=slipCount()+' '+tx('slips');
  $('best').textContent=tx('best')+': '+(+S.best||0)+' '+tx('d');
  $('gate').textContent=act?'':tx('gate2')+': '+Math.min(completed(),36)+'/36';
  $('msg').textContent=quoteOf(Math.max(0,d-1));
  $('openBtn').textContent=tx('open');
  $('openBtn').classList.toggle('hide',!(eligible()&&!act));
  $('p2box').classList.toggle('hide',!act);
  document.body.classList.toggle('fit', !$('app').classList.contains('hide') && !act);
  if(act){
    const lv=level();
    $('badges').innerHTML=BADGES[lg()].map((b,i)=>`<div class="bd${i<lv?' on':''}">${i<lv?'★ ':''}${(i+1)*6}<br>${b}</div>`).join('');
    renderLog();
  }
}

/* ---------- शेअर कार्ड ---------- */
function wrap(c,t,max){
  const w=t.split(' '); let line='', out=[];
  w.forEach(x=>{const n=line?line+' '+x:x; if(c.measureText(n).width>max&&line){out.push(line);line=x;} else line=n;});
  if(line) out.push(line);
  return out;
}
function drawCard(q){
  const c=$('cv').getContext('2d'), W=1080;
  c.textAlign='center'; c.textBaseline='middle';
  if(!S.p2.active){
    /* Phase 1: फक्त STOP! कार्ड */
    c.fillStyle='#b80000'; c.fillRect(0,0,W,W);
    c.strokeStyle='#fff'; c.lineWidth=12; c.strokeRect(40,40,W-80,W-80);
    c.fillStyle='#fff';
    c.font='bold 64px sans-serif'; c.fillText('STOP! drink Ur KING',W/2,170);
    c.font='bold 300px sans-serif'; c.fillText(String(days()),W/2,440);
    c.font='bold 70px sans-serif'; c.fillText(tx('d'),W/2,600);
    c.font='italic 46px sans-serif';
    let y=720; wrap(c,q,860).forEach(l=>{c.fillText(l,W/2,y);y+=64;});
    c.font='30px sans-serif'; c.fillText('punepoona.in · claimtak.in · navinpune.com',W/2,1000);
    return;
  }
  /* Phase 2: दोन्ही कार्ड (STOP! आणि START!) */
  c.fillStyle='#b80000'; c.fillRect(0,0,W,W);
  c.strokeStyle='#fff'; c.lineWidth=12; c.strokeRect(40,40,W-80,W-80);
  c.fillStyle='#fff';
  c.font='bold 60px sans-serif'; c.fillText('STOP! drink Ur KING',W/2,130);
  c.font='bold 64px sans-serif'; c.fillText(days()+' '+tx('d'),W/2,235);
  c.fillRect(140,300,W-280,4);
  c.font='bold 56px sans-serif'; c.fillText('START! BUILD Ur KING',W/2,375);
  c.font='bold 170px sans-serif'; c.fillText(String(p2count()),W/2,520);
  c.font='bold 48px sans-serif';
  const lv=level();
  c.fillText(lv?BADGES[lg()][lv-1]:tx('nobadge'),W/2,640);
  c.font='italic 46px sans-serif';
  let y=740; wrap(c,q,860).forEach(l=>{c.fillText(l,W/2,y);y+=64;});
  c.font='30px sans-serif'; c.fillText('punepoona.in · claimtak.in · navinpune.com',W/2,1000);
}
let cardQ='';
function showCong(title,msg,withShare=true){
  $('cT').textContent=title; $('cM').textContent=msg;
  qi=Math.floor(Math.random()*T[lg()].m.length);
  cardQ=quoteOf(qi);
  $('cv').style.display='';
  drawCard(cardQ);
  $('cS').classList.toggle('hide',!withShare);
  $('cQ').classList.toggle('hide',!withShare);
  $('cS').textContent=tx('share');
  $('cL').textContent=tx('later');
  $('cL').onclick=()=>$('ov').classList.remove('show');
  $('ov').classList.add('show');
}
function newQuote(){
  const m=T[lg()].m; let n;
  do{ n=Math.floor(Math.random()*m.length); }while(n===qi && m.length>1);
  qi=n; cardQ=quoteOf(qi); drawCard(cardQ);
}
function share(){
  drawCard(cardQ||quoteOf(days()-1));
  $('cv').toBlob(b=>{
    const name='stop-king.png'; let f=null;
    try{ f=new File([b],name,{type:'image/png'}); }catch(e){}
    const text=tx('shareTxt')(null, days());
    if(f && navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'STOP! drink Ur KING',text}).catch(()=>{});
    }else{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=name; a.click();
    }
  },'image/png');
}
function openShareCard(){
  showCong('', tx('shareTxt')(null, days()), true);
  $('cT').textContent=tx('title');
  $('cS').onclick=share;
  $('cQ').onclick=newQuote;
}

/* ---------- अपडेट संदेश (फक्त एकदाच) ---------- */
function showUpdateNotice(){
  $('cT').textContent=tx('upd');
  $('cM').textContent=tx('updm');
  $('cv').style.display='none';
  $('cS').classList.add('hide');
  $('cQ').classList.add('hide');
  $('cL').textContent=tx('ok');
  $('cL').onclick=()=>{
    localStorage.setItem(NOTICE_KEY,'1');
    $('ov').classList.remove('show');
    $('cv').style.display='';
    $('cS').classList.remove('hide');
    $('cQ').classList.remove('hide');
    $('cL').textContent=tx('later');
    $('cL').onclick=()=>$('ov').classList.remove('show');
    if(S.p2.active) showCong(tx('cg'), tx('p1msg'));
  };
  $('ov').classList.add('show');
}

/* ---------- बॅकअप (जुना आणि नवीन दोन्ही स्वरूप) ---------- */
function exportJSON(){
  try{
    const data={app:'StopDrinkUrKing',version:2,exported:new Date().toISOString(),data:{ds:JSON.stringify(S)}};
    const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    const dt=new Date().toISOString().slice(0,10);
    a.href=URL.createObjectURL(b); a.download='StopDrinkUrKing_Backup_'+dt+'.json';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert(tx('bkErr')); }
}
function extractState(o){
  if(o && o.app==='StopDrinkUrKing' && o.data && typeof o.data.ds==='string'){
    const inner=JSON.parse(o.data.ds);
    if(!inner||typeof inner!=='object'||Array.isArray(inner)) throw 0;
    return inner;
  }
  if(!o||typeof o!=='object'||Array.isArray(o)) throw 0;
  return o;
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=extractState(JSON.parse(r.result));
      if(!confirm(tx('rsAsk'))) return;
      const cur=localStorage.getItem(KEY);
      if(cur!==null) localStorage.setItem('ds_before_import', cur);
      S=o; blocked=false; ensure(); save();
      alert(tx('rsOk'));
      applyLang(); go('app');
    }catch(e){ alert(tx('rsBad')); }
  };
  r.readAsText(file);
}

/* ---------- इव्हेंट्स ---------- */
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
$('startBtn').onclick=()=>{ if(S.name) enterApp(); else go('reg'); };
$('quit').onclick=()=>{
  if(blocked) return;
  const n=$('n').value.trim(); if(!n) return;
  S.name=n; S.age=$('a').value;
  if(!S.start) S.start=Date.now();
  ensure(); save(); checkOpen(); save();
  if(!localStorage.getItem(NOTICE_KEY)){ go('app'); showUpdateNotice(); }
  else enterApp();
};
$('saveBtn').onclick=()=>{
  const n=$('n2').value.trim(); if(!n) return;
  S.name=n; S.age=$('a2').value; save(); go('app');
};
$('backBtn').onclick=()=>go('app');
$('profBtn').onclick=()=>go('prof');
$('shareBtn').onclick=openShareCard;
$('slip').onclick=slipMain;
$('p2slip').onclick=slipP2;
$('openBtn').onclick=openManual;
$('logBtn').onclick=()=>$('logWrap').classList.toggle('hide');
$('prev').onclick=()=>{ vm=new Date(vm.getFullYear(),vm.getMonth()-1,1); renderLog(); };
$('next').onclick=()=>{ vm=new Date(vm.getFullYear(),vm.getMonth()+1,1); renderLog(); };
$('cal').onclick=e=>{ const c=e.target.closest('.cell'); if(!c) return; selDate=c.dataset.d; renderLog(); };
$('ed').onclick=e=>{ const b=e.target.closest('button[data-s]'); if(b) logSet(b.dataset.s); };
$('cQ').onclick=newQuote;
$('cS').onclick=share;
$('ov').onclick=e=>{ if(e.target===$('ov')) $('ov').classList.remove('show'); };
$('exBtn').onclick=exportJSON;
$('imBtn').onclick=()=>$('im').click();
$('im').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); };

/* Install prompt */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('ib').classList.remove('hide'); });
$('ib').onclick=()=>{ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; } $('ib').classList.add('hide'); };
if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone){ $('ios').classList.remove('hide'); }

/* ---------- व्हिडिओ ---------- */
const VID={
  welcome:{mr:'videos/welcome_mr.webm',hi:'videos/welcome_hi.webm',en:'videos/welcome_en.webm'},
  p2:{mr:'videos/phase2_mr.webm',hi:'videos/phase2_hi.webm',en:'videos/phase2_en.webm'}
};
const P2_QUOTA=[3,2,1];   /* Phase 2 च्या पहिल्या दिवशी 3, दुसऱ्या दिवशी 2, तिसऱ्या दिवशी 1 */
function playVideo(src,onEnd){
  const v=$('vid');
  let done=false;
  const fin=()=>{
    if(done) return; done=true;
    v.onended=null; v.onerror=null;
    v.pause(); v.removeAttribute('src'); v.load();
    $('vOv').classList.remove('show');
    if(onEnd) onEnd();
  };
  v.onended=fin; v.onerror=fin;
  $('vClose').onclick=fin;
  v.src=src;
  $('vOv').classList.add('show');
  v.play().catch(()=>{});
}
/* पहिल्यांदा ॲप उघडल्यावर: भाषा निवड -> त्या भाषेचा स्वागत व्हिडिओ (एकदाच) */
function startLanguagePick(){ $('lgOv').classList.add('show'); }
document.querySelectorAll('[data-pl]').forEach(b=>b.addEventListener('click',()=>{
  const l=b.dataset.pl;
  S.lang=l; save(); applyLang();
  $('lgOv').classList.remove('show');
  playVideo(VID.welcome[l], ()=>{ localStorage.setItem('wel_done','1'); go('home'); });
}));
/* Phase 2 चे व्हिडिओ: दिवसानुसार कोटा; कोटा संपल्यावर किंवा Phase 2 नसल्यास थेट पुढे */
function maybeP2Video(then){
  if(!S.p2.active || !S.p2.start){ then(); return; }
  const dayIdx=Math.round((today()-new Date(S.p2.start))/DAY)+1;
  const quota=P2_QUOTA[dayIdx-1]||0;
  let st={};
  try{ st=JSON.parse(localStorage.getItem('p2v')||'{}'); }catch(e){}
  const k=iso(today());
  if(st.d!==k){ st={d:k,c:0}; }
  if(quota===0 || st.c>=quota){ then(); return; }
  st.c+=1;
  localStorage.setItem('p2v',JSON.stringify(st));
  playVideo(VID.p2[lg()], then);
}
function enterApp(){
  go('app');
  maybeP2Video(()=>{ if(S.p2.active) showCong(tx('cg'), tx('p1msg')); });
}

/* ---------- सुरुवात ---------- */
ensure();
applyLang();
if(blocked){
  $('home').innerHTML='<p class="tag">'+T.mr.bad+'</p>';
  alert(T.mr.bad);
}else{
  if(S.name && S.start){ checkOpen(); save(); }
  go('home');
  if(!S.start && !localStorage.getItem('wel_done')){ startLanguagePick(); }
  if(!localStorage.getItem(NOTICE_KEY) && S.start){ showUpdateNotice(); }
}
showCount();
countInstall().then(showCount);
setInterval(()=>{ if(!blocked && !$('app').classList.contains('hide')) render(); },60000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
