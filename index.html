<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#b80000"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>मी आज पासून दारू सोडली</title>
<style>
:root{--bg:#fff7f0;--card:#fff;--tx:#2a1414;--red:#b80000;--gold:#d4a017;--mut:#7a6060;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0c0c;--card:#2a1414;--tx:#fff2e6;--mut:#c9a9a9}}
:root[data-theme="dark"]{--bg:#1a0c0c;--card:#2a1414;--tx:#fff2e6;--mut:#c9a9a9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif;text-align:center}
main{max-width:440px;margin:0 auto;padding:16px}
img.logo{width:200px;max-width:70%;display:block;margin:8px auto}
h1{color:var(--red);font-size:26px;margin:8px 0}
.card{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:18px;margin:14px 0}
.big{font-size:64px;font-weight:900;color:var(--red);line-height:1.1}
.sm{color:var(--mut);font-size:16px}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:19px;font-weight:800;margin:6px 0;background:var(--red);color:#fff;cursor:pointer}
button.g{background:var(--gold);color:#2a1414}button.o{background:transparent;color:var(--red);border:2px solid var(--red)}
input{width:100%;padding:14px;font-size:18px;border:2px solid var(--gold);border-radius:12px;margin:6px 0;background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px}.row button{font-size:15px;padding:14px 6px}
.lang{display:flex;gap:6px;justify-content:center}.lang button{width:auto;padding:6px 14px;font-size:14px;background:var(--card);color:var(--tx);border:1px solid var(--gold)}
.lang button.on{background:var(--gold);color:#2a1414}
footer{margin:24px 0 8px;font-size:14px}footer a{display:block;color:var(--red);padding:3px}
.hide{display:none}
</style></head><body><main>
