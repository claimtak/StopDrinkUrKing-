<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b80000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>STOP! drink Ur KING</title>
<style>
:root{--red:#b80000;--bg:#fff;--fg:#1d1d1d;--mut:#666;--gold:#e0a800;--line:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f5f5f5;--mut:#aaa;--line:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:460px;margin:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.logo{display:block;margin:0 auto 8px;max-width:120px;height:auto}
.tag{text-align:center;font-weight:800;color:var(--red);font-size:20px}
.big{font-size:96px;font-weight:800;text-align:center;color:var(--red);line-height:1}
.sm{text-align:center;color:var(--mut);font-size:14px;margin:4px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;background:var(--red);color:#fff;width:100%;margin:6px 0;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.cell.sel{outline:2px solid var(--red)}
.ic{font-size:11px;color:var(--red)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);font-size:12px;filter:grayscale(1);opacity:.5}
.bd.on{filter:none;opacity:1;background:linear-gradient(135deg,#fff3c4,#e0a800);color:var(--red);border-color:var(--gold);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.show{display:flex}
.mc{background:var(--bg);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center}
canvas{width:100%;height:auto;border-radius:12px}
.hide{display:none!important}
footer{text-align:center;font-size:12px;color:var(--mut);margin-top:18px;line-height:1.8}
footer a{color:var(--red);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<img class="logo" id="logo" src="stop-logo.png" alt="" onerror="this.style.display='none'">
<div class="tag" id="tag"></div>
<div class="sm" id="cnt"></div>

<div id="reg" class="hide card">
  <input id="n" placeholder="नाव">
  <input id="a" type="number" placeholder="वय">
  <button id="quit">मी आज पासून बंद केली</button>
</div>

<div id="main" class="hide">
  <div class="big" id="big"></div>
  <div class="sm" id="bigL"></div>
  <div class="sm" id="small"></div>
  <div class="sm" id="sl"></div>
  <div class="sm" id="best"></div>
  <div class="sm" id="gate"></div>
  <button id="openBtn" class="alt hide">Phase 2 सुरू करा</button>
  <button id="slip">आज मी घसरलो</button>

  <div id="p2box" class="card hide">
    <div class="tag">START! BUILD Ur KING</div>
    <h3>बॅजेस</h3>
    <div class="badges" id="badges"></div>
    <button id="logBtn" class="alt">नोंद / कॅलेंडर</button>
    <div id="logWrap" class="hide">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button id="prev" class="alt" style="width:auto;padding:6px 12px">‹</button>
        <b id="mon"></b>
        <button id="next" class="alt" style="width:auto;padding:6px 12px">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <div id="ed"></div>
    </div>
    <button id="p2slip" class="alt">Phase 2 मध्ये घसरलो</button>
  </div>

  <div style="display:flex;gap:8px">
    <button id="ex" class="alt">Export</button>
    <button id="imBtn" class="alt">Import</button>
    <input type="file" id="im" accept="application/json" class="hide">
  </div>
</div>

<footer>
  <a href="https://punepoona.in">punepoona.in</a> · <a href="https://claimtak.in">claimtak.in</a> · <a href="https://navinpune.com">navinpune.com</a>
</footer>

<div class="ov" id="ov"><div class="mc">
  <h2 id="cT"></h2>
  <p id="cM"></p>
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="cS">शेअर करा</button>
  <button id="cQ" class="alt">नवीन कोट</button>
  <button id="cL" class="alt">नंतर पाहू</button>
</div></div>

<script>
'use strict';
/* ===== Firebase config (फक्त येथे भरा) =====
   Firebase console > Project settings > General > Your apps > Web app
   मधून projectId आणि apiKey कॉपी करून खालील जागी टाका. */
const FB={projectId:'YOUR_PROJECT_ID', apiKey:'YOUR_API_KEY'};

/* जुन्या ॲपची मूळ key — बदलू नका */
const KEY='ds';
const NOTICE_KEY='ds_notice_v2';
const DAY=864e5;
/* फक्त लाइव्ह URL वरच counter वाढतो; चाचणी URL वर वाढत नाही */
const IS_LIVE=location.hostname==='claimtak.github.io';
const CNT_BASE=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/stats/counter`;

const $=id=>document.getElementById(id);
const BADGES=['जागरूकता जागली','सातत्य चॅम्पियन','स्थिर पाऊल','शांत मन','दृढ निश्चय','लोह इच्छाशक्ती','सजग हृदय','संयमी योद्धा','तेजस्वी मार्ग','शुद्ध संकल्प','उगवता तारा','जागरूक जीवनाचा राजा'];
const ICON={done:'★',done_late:'⏰',plan:'✎',missed:'✕'};
const QUOTES=[
 'आजचा दिवस तुमचा आहे. एक एक दिवस जिंकत चला.',
 'तुम्ही केवळ दारू सोडत नाही, नवं आयुष्य घडवत आहात.',
 'इच्छा येते आणि जाते. तुम्ही टिकून राहा.',
 'तुमची शिस्तच तुमची खरी ताकद आहे.',
 'एक दिवस, एक पाऊल. तुम्ही योग्य वाटेवर आहात.',
 'तुम्ही स्वतःला दिलेलं वचन पाळत आहात.',
 'आज तुम्ही कालपेक्षा अधिक मजबूत आहात.',
 'प्रत्येक सकाळ आता अधिक ताजी आहे.'
];
const P1='जगात फक्त 1% लोक 36 दिवस पार करतात. आणि तुम्ही त्यातील 1 आहात.';

let blocked=false;
let S=load(), selDate=null, vm=new Date(), qi=0;

/* ---------- डेटा (जुने फील्ड जसेच्या तसे) ---------- */
function load(){
  const raw=localStorage.getItem(KEY);
  if(raw===null) return {};
  let o;
  try{ o=JSON.parse(raw); if(!o||typeof o!=='object'||Array.isArray(o)) throw 0; }
  catch(e){
    localStorage.setItem('ds_corrupt_'+Date.now(), raw);
    blocked=true;
    return {};
  }
  localStorage.setItem('ds_bk', raw);
  return o;
}
function save(){
  if(blocked) return;
  const prev=localStorage.getItem(KEY);
  if(prev!==null) localStorage.setItem('ds_prev', prev);
  S.schemaVersion=2;
  localStorage.setItem(KEY, JSON.stringify(S));
}
function ensure(){
  if(!S.p2||typeof S.p2!=='object') S.p2={active:false,start:null,logs:{}};
  if(!S.p2.logs) S.p2.logs={};
  if(typeof S.best!=='number') S.best=+S.best||0;
  if(S.slips===undefined) S.slips=0;
}
function slipCount(){ return Array.isArray(S.slips)?S.slips.length:(+S.slips||0); }

function today(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function days(){
  if(!S.start) return 0;
  return Math.max(1,Math.round((today()-new Date(S.start))/DAY)+1);
}
function completed(){ return Math.max(+S.best||0, days()-1); }
function eligible(){ return completed()>=36; }
function p2count(){
  if(!S.p2.start) return 0;
  return Object.keys(S.p2.logs).filter(k=>k>=S.p2.start && (S.p2.logs[k].s==='done'||S.p2.logs[k].s==='done_late')).length;
}
function level(){ return Math.min(12,Math.floor(p2count()/6)); }

/* ---------- Firebase install counter ---------- */
async function readCount(){
  let cache=null;
  try{ cache=JSON.parse(localStorage.getItem('cc')||'null'); }catch(e){}
  if(cache && Date.now()-cache.t<5*60e3) return cache.n;
  try{
    const r=await fetch(CNT_BASE+'?key='+FB.apiKey);
    if(!r.ok) throw 0;
    const j=await r.json();
    const n=+(j.fields&&j.fields.installs&&j.fields.installs.integerValue)||0;
    localStorage.setItem('cc',JSON.stringify({n,t:Date.now()}));
    return n;
  }catch(e){ return cache?cache.n:null; }
}
async function countInstall(){
  if(!IS_LIVE) return;
  if(localStorage.getItem('ci')==='1') return;
  try{
    const r=await fetch(CNT_BASE+'?key='+FB.apiKey);
    if(!r.ok) return;
    const j=await r.json();
    const cur=+(j.fields.installs.integerValue)||0;
    const url=CNT_BASE+'?updateMask.fieldPaths=installs&key='+FB.apiKey;
    const w=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{installs:{integerValue:String(cur+1)}}})});
    if(w.ok){ localStorage.setItem('ci','1'); localStorage.removeItem('cc'); }
  }catch(e){}
}
async function showCount(){
  const n=await readCount();
  if(n!==null) $('cnt').textContent=n.toLocaleString('en-IN')+' लोकांनी ॲप इन्स्टॉल केले';
}

/* ---------- घसरणी ---------- */
function slipMain(){
  if(!confirm('घसरलात? नव्याने सुरुवात करायची का?')) return;
  S.best=Math.max(+S.best||0,days());
  S.slips=slipCount()+1;
  S.start=Date.now();
  save(); render();
}
function slipP2(){
  if(!confirm('Phase 2 मध्ये घसरलात? Phase 2 चे दिवस व बॅजेस शून्य होतील (नोंदी जतन राहतील).')) return;
  S.p2.start=iso(today());
  save(); render();
}

/* ---------- Phase 2 ---------- */
function checkOpen(){
  if(!S.p2.active && eligible()){
    S.p2.active=true; S.p2.start=iso(today()); save();
  }
}
function openManual(){
  if(!eligible()) return;
  S.p2.active=true; S.p2.start=iso(today()); save(); render();
}

/* ---------- नोंद ---------- */
function logSet(status){
  const k=selDate, before=level();
  const st=(status==='done' && k<iso(today()))?'done_late':status;
  S.p2.logs[k]={s:st,plan:$('pl').value.trim(),note:$('nt').value.trim()};
  save();
  const after=level();
  render();
  if(status==='done' && after>before) showCong('नवीन बॅज: '+BADGES[after-1],'अभिनंदन! तुम्ही नवीन बॅज मिळवला.');
}
function renderLog(){
  const y=vm.getFullYear(), m=vm.getMonth(), first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  $('mon').textContent=vm.toLocaleDateString('mr-IN',{month:'long',year:'numeric'});
  let h='';
  for(let i=0;i<first;i++) h+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=iso(new Date(y,m,d)), l=S.p2.logs[k];
    h+=`<div class="cell${k===selDate?' sel':''}" data-d="${k}">${d}<span class="ic">${l?ICON[l.s]:''}</span></div>`;
  }
  $('cal').innerHTML=h;
  if(selDate){
    const l=S.p2.logs[selDate]||{};
    $('ed').innerHTML=`<div class="card"><b>${selDate}</b>
      <textarea id="pl" rows="2" placeholder="योजना"></textarea>
      <textarea id="nt" rows="4" placeholder="ऐच्छिक लांब नोंद"></textarea>
      <button data-s="done">✓ केले</button>
      <button data-s="plan" class="alt">✎ योजना</button>
      <button data-s="missed" class="alt">✕ केले नाही</button></div>`;
    $('pl').value=l.plan||''; $('nt').value=l.note||'';
  } else $('ed').innerHTML='';
}

/* ---------- रेंडर ---------- */
function render(){
  const act=S.p2.active, d=days(), p=p2count();
  $('tag').textContent=act?'START! BUILD Ur KING':'STOP! drink Ur KING';
  $('logo').src=act?'start-logo.png':'stop-logo.png';
  $('logo').style.display='';
  $('big').textContent=act?p:d;
  $('bigL').textContent=act?'दिवस (Phase 2)':'दिवस';
  $('small').textContent=act?('STOP! '+d+' दिवस'):'';
  $('sl').textContent='घसरलो: '+slipCount()+' वेळा';
  $('best').textContent='सर्वोच्च रेकॉर्ड: '+(+S.best||0)+' दिवस';
  $('gate').textContent=act?'':'Phase 2 साठी: '+Math.min(completed(),36)+'/36 दिवस';
  $('openBtn').classList.toggle('hide',!(eligible()&&!act));
  $('p2box').classList.toggle('hide',!act);
  if(act){
    const lv=level();
    $('badges').innerHTML=BADGES.map((b,i)=>`<div class="bd${i<lv?' on':''}">${i<lv?'★ ':''}${(i+1)*6}<br>${b}</div>`).join('');
    renderLog();
  }
}

/* ---------- शेअर कार्ड ---------- */
function wrap(c,t,max){
  const w=t.split(' '); let line='', out=[];
  w.forEach(x=>{const n=line?line+' '+x:x; if(c.measureText(n).width>max&&line){out.push(line);line=x;} else line=n;});
  if(line) out.push(line);
  return out;
}
function drawCard(q){
  const c=$('cv').getContext('2d'), W=1080;
  c.fillStyle='#b80000'; c.fillRect(0,0,W,W);
  c.strokeStyle='#fff'; c.lineWidth=12; c.strokeRect(40,40,W-80,W-80);
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  c.font='bold 60px sans-serif'; c.fillText('STOP! drink Ur KING',W/2,130);
  c.font='bold 64px sans-serif'; c.fillText(days()+' दिवस',W/2,235);
  c.fillRect(140,300,W-280,4);
  c.font='bold 56px sans-serif'; c.fillText('START! BUILD Ur KING',W/2,375);
  c.font='bold 170px sans-serif'; c.fillText(String(p2count()),W/2,520);
  c.font='bold 48px sans-serif';
  const lv=level(); c.fillText(lv?('बॅज: '+BADGES[lv-1]):'पहिला बॅज अजून बाकी',W/2,640);
  c.font='italic 46px sans-serif';
  let y=740; wrap(c,q,860).forEach(l=>{c.fillText(l,W/2,y);y+=64;});
  c.font='30px sans-serif'; c.fillText('punepoona.in · claimtak.in · navinpune.com',W/2,1000);
}
function showCong(title,msg){
  $('cT').textContent=title; $('cM').textContent=msg;
  qi=Math.floor(Math.random()*QUOTES.length);
  drawCard(QUOTES[qi]);
  $('ov').classList.add('show');
}
function newQuote(){
  let n; do{ n=Math.floor(Math.random()*QUOTES.length); }while(n===qi && QUOTES.length>1);
  qi=n; drawCard(QUOTES[qi]);
}
function share(){
  $('cv').toBlob(b=>{
    const name='stop-king.png'; let f=null;
    try{ f=new File([b],name,{type:'image/png'}); }catch(e){}
    if(f && navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'STOP! drink Ur KING'}).catch(()=>{});
    }else{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=name; a.click();
    }
  },'image/png');
}

/* ---------- अपडेट संदेश (फक्त एकदाच) ---------- */
function showUpdateNotice(){
  $('cT').textContent='ॲप अपडेट झाले';
  $('cM').textContent='तुमचा डेटा सुरक्षित आहे.';
  $('cv').style.display='none';
  $('cS').classList.add('hide');
  $('cQ').classList.add('hide');
  $('cL').textContent='ठीक आहे';
  $('cL').onclick=()=>{
    localStorage.setItem(NOTICE_KEY,'1');
    $('ov').classList.remove('show');
    $('cv').style.display='';
    $('cS').classList.remove('hide');
    $('cQ').classList.remove('hide');
    $('cL').textContent='नंतर पाहू';
    $('cL').onclick=()=>$('ov').classList.remove('show');
    if(S.p2.active) showCong('अभिनंदन!', P1);
  };
  $('ov').classList.add('show');
}

/* ---------- बॅकअप ---------- */
function exportJSON(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='stop-king-backup.json'; a.click();
}
/* जुना बॅकअप: {app, version, data:{ds:"..."}} ; नवीन बॅकअप: थेट S */
function extractState(o){
  if(o && o.app==='StopDrinkUrKing' && o.data && typeof o.data.ds==='string'){
    const inner=JSON.parse(o.data.ds);
    if(!inner||typeof inner!=='object'||Array.isArray(inner)) throw 0;
    return inner;
  }
  if(!o||typeof o!=='object'||Array.isArray(o)) throw 0;
  return o;
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=extractState(JSON.parse(r.result));
      if(!confirm('सध्याचा डेटा बदलला जाईल. पुढे जायचं का?')) return;
      const cur=localStorage.getItem(KEY);
      if(cur!==null) localStorage.setItem('ds_before_import', cur);
      S=o; blocked=false; ensure(); save(); show();
    }catch(e){ alert('ही फाइल चालणार नाही. कृपया योग्य बॅकअप (.json) फाइल निवडा.'); }
  };
  r.readAsText(file);
}

/* ---------- इव्हेंट्स ---------- */
function show(){
  $('reg').classList.add('hide'); $('main').classList.remove('hide');
  ensure(); checkOpen(); render();
  if(blocked) return;
  if(!localStorage.getItem(NOTICE_KEY)){ showUpdateNotice(); return; }
  if(S.p2.active) showCong('अभिनंदन!', P1);
}
$('quit').onclick=()=>{
  if(blocked) return;
  const n=$('n').value.trim(); if(!n) return;
  S.name=n; S.age=$('a').value;
  if(!S.start) S.start=Date.now();
  ensure(); save(); show();
};
$('slip').onclick=slipMain;
$('p2slip').onclick=slipP2;
$('openBtn').onclick=openManual;
$('logBtn').onclick=()=>$('logWrap').classList.toggle('hide');
$('prev').onclick=()=>{ vm=new Date(vm.getFullYear(),vm.getMonth()-1,1); renderLog(); };
$('next').onclick=()=>{ vm=new Date(vm.getFullYear(),vm.getMonth()+1,1); renderLog(); };
$('cal').onclick=e=>{ const c=e.target.closest('.cell'); if(!c) return; selDate=c.dataset.d; renderLog(); };
$('ed').onclick=e=>{ const b=e.target.closest('button[data-s]'); if(b) logSet(b.dataset.s); };
$('cS').onclick=share;
$('cQ').onclick=newQuote;
$('cL').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target===$('ov')) $('ov').classList.remove('show'); };
$('ex').onclick=exportJSON;
$('imBtn').onclick=()=>$('im').click();
$('im').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); };

/* ---------- सुरुवात ---------- */
if(blocked){
  $('tag').textContent='डेटा वाचता आला नाही';
  $('main').classList.add('hide');
  alert('तुमचा जुना डेटा वाचता आला नाही. तो सुरक्षित ठेवला आहे. कृपया आम्हाला संपर्क करा.');
}else if(!S.start && !S.name){
  $('reg').classList.remove('hide');
  $('tag').textContent='STOP! drink Ur KING';
}else{
  show();
}
showCount();
countInstall().then(showCount);
setInterval(()=>{ if(!blocked && !$('main').classList.contains('hide')) render(); },60000);
